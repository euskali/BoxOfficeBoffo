[project]
name = "boffo-etl"
version = "0.1.0"
description = "ETL for BoxOfficeBozo: historical US box office rankings as of any date"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars",
    "pyarrow",
    "duckdb",
    "pyreadr",
    "httpx",
    "rapidfuzz",
]

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["boffo_etl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
